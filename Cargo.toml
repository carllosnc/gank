[package]
name = "Gank"
version = "0.1.0"
edition = "2021"
description = "Fast, lightweight game shortcut hub in Rust"
license = "MIT"

[dependencies]
eframe = { version = "0.27", default-features = false, features = [
    "default_fonts",
    "wgpu",
] }
egui = "0.27"
egui_extras = { version = "0.27", features = ["file", "image"] }
image = { version = "0.24", default-features = false, features = ["jpeg", "png", "webp"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
winreg = "0.52"
ureq = { version = "2.10", features = ["json"] }
egui-phosphor = "0.5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
